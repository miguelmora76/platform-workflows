# Local-only store for trying External Secrets on minikube. The "fake" provider serves the values below from the
# manifest itself, so there is no real secrets manager and these are placeholders, not credentials.
# In a real cluster replace this with a store for AWS Secrets Manager, Vault, etc.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-fake
spec:
  provider:
    fake:
      data:
        - key: /claims-rag-java/anthropic-api-key
          value: sk-ant-placeholder-not-a-real-key
