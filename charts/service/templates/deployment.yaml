{{- $tcp := dict "tcpSocket" (dict "port" "http") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if or .Values.env .Values.secretEnv }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $ref := .Values.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "secretEnv.%s.secret is required" $k) $ref.secret }}
                  key: {{ required (printf "secretEnv.%s.key is required" $k) $ref.key }}
                  optional: {{ default false $ref.optional }}
            {{- end }}
          {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            {{- toYaml (default $tcp .Values.livenessProbe) | nindent 12 }}
          readinessProbe:
            {{- toYaml (default $tcp .Values.readinessProbe) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.writablePaths }}
          volumeMounts:
            {{- range $i, $p := .Values.writablePaths }}
            - name: writable-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
          {{- end }}
      {{- if .Values.writablePaths }}
      volumes:
        {{- range $i, $p := .Values.writablePaths }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
      {{- end }}
