# Defaults for every service. A service's own values file overrides these.
replicaCount: 1

image:
  repository: ""        # required
  tag: dev
  pullPolicy: IfNotPresent

containerPort: 8080

# Plain environment variables.
env: {}

# Optional: name of an existing Secret whose keys are all injected as env vars
# (for example ANTHROPIC_API_KEY). The chart never creates or stores secrets.
existingSecret: ""

# Optional: individual env vars read from a single key of an existing Secret (least privilege, unlike
# existingSecret which injects every key). Example:
#   secretEnv:
#     ANTHROPIC_API_KEY: { secret: my-service-anthropic, key: api-key }
# Set optional: true to let the pod start when the Secret or key is missing.
secretEnv: {}

# Optional: an ExternalSecret that syncs keys from a secrets manager into a Kubernetes Secret, which secretEnv or
# existingSecret can then reference. Holds only references, never values. Needs the External Secrets Operator CRDs
# and an existing (Cluster)SecretStore. The target Secret defaults to <release>-external.
externalSecret:
  enabled: false
  store: { name: "", kind: ClusterSecretStore }
  refreshInterval: 1h
  target: ""
  data: []        # - { secretKey: api-key, remoteKey: path/in/store, property: optional-json-field }

# Mount an emptyDir at each path so the root filesystem can stay read-only.
writablePaths: [/tmp]

service:
  enabled: true
  type: ClusterIP
  port: 80

# Raw probe objects. If left empty the chart probes a TCP connection to containerPort.
livenessProbe: {}
readinessProbe: {}

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# PrometheusRule that fires when no replica of the deployment is available.
# Needs the Prometheus Operator CRDs, so it is off unless the cluster has them.
alert:
  enabled: false
  for: 1m
  severity: critical
  labels: {}

# ServiceMonitor that makes Prometheus scrape the service's own metrics endpoint (needs the service to expose one
# and service.enabled). Needs the Prometheus Operator CRDs, so it is off unless the cluster has them.
metrics:
  enabled: false
  path: /metrics
  interval: 30s
