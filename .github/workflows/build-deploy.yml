# Reusable workflow: build a service's image, then deploy it with the shared chart to a throwaway kind
# cluster as a smoke test. Call it from a service repo:
#
#   jobs:
#     deploy:
#       uses: miguelmora76/platform-workflows/.github/workflows/build-deploy.yml@v1
#       with:
#         service: claims-rag-python
#         values-file: deploy/values.yaml
name: build-deploy

on:
  workflow_call:
    inputs:
      service:
        description: Helm release and image name
        type: string
        required: true
      values-file:
        description: Path to the service's values file, relative to the calling repo
        type: string
        default: deploy/values.yaml
      profile:
        description: Chart profile (dev or prod-like)
        type: string
        default: dev
      context:
        description: Docker build context, relative to the calling repo
        type: string
        default: .
      secret-name:
        description: Optional. Create a Secret with this name holding a random CI-only value
        type: string
        default: ""
      secret-key:
        description: Key inside that Secret (the env var name the service reads)
        type: string
        default: ""
      secret-prefix:
        description: Text placed before the random value (for example local=mgt_)
        type: string
        default: ""
      smoke-port:
        description: Optional. Container port to port-forward and send a smoke request to (same local port)
        type: string
        default: ""
      smoke-path:
        type: string
        default: /
      smoke-body:
        description: Request body (the method becomes POST)
        type: string
        default: ""
      smoke-headers:
        description: Extra request headers, one "Name: value" per line
        type: string
        default: ""
      smoke-expect:
        description: Text the response must contain
        type: string
        default: ""
      smoke-bearer-secret-key:
        description: Optional. Send the value of this key in the CI Secret as a bearer token (text after the first "=")
        type: string
        default: ""
      platform-ref:
        description: Ref of platform-workflows to take the chart from
        type: string
        default: main

permissions:
  contents: read

jobs:
  smoke-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the service
        uses: actions/checkout@v4

      - name: Check out the platform chart
        uses: actions/checkout@v4
        with:
          repository: miguelmora76/platform-workflows
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - name: Lint chart with the service's values
        uses: azure/setup-helm@v4
      - run: |
          helm lint .platform/charts/service \
            -f .platform/charts/service/profiles/${{ inputs.profile }}.yaml \
            -f ${{ inputs.values-file }}

      - name: Build image
        run: docker build -t ${{ inputs.service }}:ci ${{ inputs.context }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke

      - name: Create CI-only secret
        if: inputs.secret-name != ''
        run: |
          kubectl create namespace apps
          kubectl -n apps create secret generic "${{ inputs.secret-name }}" \
            --from-literal="${{ inputs.secret-key }}=${{ inputs.secret-prefix }}$(openssl rand -hex 16)"

      - name: Load image and deploy
        run: |
          kind load docker-image ${{ inputs.service }}:ci --name smoke
          helm upgrade --install ${{ inputs.service }} .platform/charts/service \
            --namespace apps --create-namespace \
            -f .platform/charts/service/profiles/${{ inputs.profile }}.yaml \
            -f ${{ inputs.values-file }} \
            --set image.tag=ci --set alert.enabled=false \
            --wait --timeout 5m

      - name: Set up Go
        if: inputs.smoke-port != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: .platform/go.mod
          cache: false

      - name: Smoke request
        if: inputs.smoke-port != ''
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.smoke-port }}
          SMOKE_PATH: ${{ inputs.smoke-path }}
          BODY: ${{ inputs.smoke-body }}
          HEADERS: ${{ inputs.smoke-headers }}
          EXPECT: ${{ inputs.smoke-expect }}
          SECRET_NAME: ${{ inputs.secret-name }}
          BEARER_KEY: ${{ inputs.smoke-bearer-secret-key }}
        run: |
          (cd .platform && go build -o "$GITHUB_WORKSPACE/smoke" ./cmd/smoke)
          kubectl -n apps port-forward "deploy/$SERVICE" "$PORT:$PORT" >/dev/null 2>&1 &
          args=(--url "http://localhost:$PORT$SMOKE_PATH" --retries 10)
          [ -n "$BODY" ] && args+=(--body "$BODY")
          [ -n "$EXPECT" ] && args+=(--expect-contains "$EXPECT")
          while IFS= read -r h; do [ -n "$h" ] && args+=(--header "$h"); done <<< "$HEADERS"
          if [ -n "$BEARER_KEY" ]; then
            value=$(kubectl -n apps get secret "$SECRET_NAME" -o jsonpath="{.data.$BEARER_KEY}" | base64 -d)
            args+=(--header "Authorization: Bearer ${value#*=}")
          fi
          ./smoke "${args[@]}"

      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n apps get pods -o wide
          kubectl -n apps describe pods
          kubectl -n apps logs -l app.kubernetes.io/instance=${{ inputs.service }} --tail=100
