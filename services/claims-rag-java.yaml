image:
  repository: claims-rag-java
containerPort: 8080
env:
  ASSISTANT_PROVIDER: fake
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
readinessProbe:
  httpGet: { path: /actuator/health/readiness, port: http }
  initialDelaySeconds: 10
livenessProbe:
  httpGet: { path: /actuator/health/liveness, port: http }
  initialDelaySeconds: 30
metrics:
  enabled: true
  path: /actuator/prometheus
# Anthropic key arrives through External Secrets (the local fake store holds a placeholder). The provider stays
# "fake", so this only exercises the plumbing; switch ASSISTANT_PROVIDER to claude with a real store to use it.
externalSecret:
  enabled: true
  store: { name: local-fake }
  data:
    - { secretKey: api-key, remoteKey: /claims-rag-java/anthropic-api-key }
secretEnv:
  ANTHROPIC_API_KEY: { secret: claims-rag-java-external, key: api-key }
