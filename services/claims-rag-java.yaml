image:
  repository: claims-rag-java
containerPort: 8080
env:
  ASSISTANT_PROVIDER: fake
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
readinessProbe:
  tcpSocket: { port: http }
  initialDelaySeconds: 10
livenessProbe:
  tcpSocket: { port: http }
  initialDelaySeconds: 30
