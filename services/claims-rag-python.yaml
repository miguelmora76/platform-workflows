image:
  repository: claims-rag-python
containerPort: 8000
env:
  ASSISTANT_PROVIDER: fake
  LOG_FORMAT: json
readinessProbe:
  httpGet: { path: /readyz, port: http }
livenessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 10
metrics:
  enabled: true
  path: /metrics
# Same plumbing as claims-rag-java: the key arrives through External Secrets (local fake store, placeholder value).
externalSecret:
  enabled: true
  store: { name: local-fake }
  data:
    - { secretKey: api-key, remoteKey: /claims-rag-python/anthropic-api-key }
secretEnv:
  ANTHROPIC_API_KEY: { secret: claims-rag-python-external, key: api-key }
